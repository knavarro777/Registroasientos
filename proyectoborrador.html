    <br><br>
    <div class="container"> <!--Se encierra en un contenedor la sección de reservación y eliminación, esto
    pues serán separados para ponerlos en dos columnas-->
    <div class="reservation"> <!--Se contiene todo lo relacionado a la reservacion en la etiqueta div para poder darle una posición especifica-->
        <!--Se le asigna un label a un input tipo texto, con un placeholder que indica donde debe ir
        la información. se le asigna el id de nombre-->
        <label for="nombre">Nombre del cliente: </label>
       <input type="text" id="nombre" placeholder="Ingrese el nombre">
       <br>
       <br>
       <label for="numasientos">Total de asientos:</label>
       <input type="text" id="numasientos" placeholder="Cantidad a reservar">
       <br><br>
            <!--esta vez se trata de un input tipo submit, que es un botón que 
            enviará los valores del formulario a ser precesados. Se le asigna un valor que será
            lo que dirá dentro del botón. se le asigna su respectivo id y un evento que accionará
            una función especifica-->
       <input type="submit" id="registrar" value="Registrar" onclick="vectornumasientos()">

       <input type="submit" id="modificar" value="Modificar" onclick="modificar()"><br><br>
    </div>
    <!--la etiqueta hr sirve para crear un divisor entre la clase reservation y la clase eliminar-->
    <hr class="divisor">
    <!--Esta clase no se encuentra dentro de reservation puesto que no irá en cáscada, sino que se
    creará una segunda columna donde se mostrará esta información-->
    <div class="eliminar">
        <!--Se le asigna un label a un input tipo texto, con un placeholder que indica donde debe ir
        la información. se le asigna el id de nombre-->
       <label for="eliminacionregistro">Cantidad de asientos a eliminar: </label>
       <input type="text" id="eliminacionregistro" placeholder="Cantidad a eliminar"><br><br>
       <input type="reset" id="eliminar" value="Eliminar" onclick="eliminar()"> <br><br>
    </div>
</div>
